        body {

    <style>
    .image-row {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 120px;

        position: absolute;
        left: 40px;
        top: 50%;
        transform: translateY(-50%);
    }

    .image-row a {
        display: block;
        flex: 1;
        max-width: 200px;
    }

    .image-row img {
        width: 150%;
        height: auto;
        display: block;
    transition: transform 0.2s ease;
    }

    .image-row a:hover img {
        animation: bob 0.4s ease-in-out infinite alternate;
    }
 @keyframes bob {
        from {
            transform: translateY(0);
        }
        to {
            transform: translateY(-10px);
        }
    }
</style>
</head>

<body>

    <script>
    document.querySelectorAll(".hover-image").forEach(img => {
        const originalImage = img.src;
        const hoverImage = img.dataset.hover;

        img.addEventListener("mouseenter", () => {
            img.src = hoverImage;
        });

        img.addEventListener("mouseleave", () => {
            img.src = originalImage;
        });
    });
</script>
