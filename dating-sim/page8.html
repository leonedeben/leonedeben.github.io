<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>top!</title>
    
    <style> 
        body {
            background-image: url("/dfvdf.jpg");
            background-repeat: no-repeat;
             background-position: center;
             background-size: cover;
             background-attachment: fixed;
             margin: 0;
            min-height: 100vh;
        }
    </style>
    <style>
    .image-row {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 120px;

        position: absolute;
        left: 40px;
        top: 50%;
        transform: translateY(-50%);
    }

    .image-row a {
        display: block;
        flex: 1;
        max-width: 200px;
    }

    .image-row img {
        width: 150%;
        height: auto;
        display: block;
    transition: transform 0.2s ease;
    }

    .image-row a:hover img {
        animation: bob 0.4s ease-in-out infinite alternate;
    }
 @keyframes bob {
        from {
            transform: translateY(0);
        }
        to {
            transform: translateY(-10px);
        }
    }
 .pajama-image {
    position: fixed;
    right: -50px;
    top: 50%;
    transform: translateY(-50%);
    width: 700px;
    height: auto;
    z-index: 10;
}
</style>
</head>

<body>

   <div class="image-row">
    <a href="page9.html">
        <img src="badoutfittopno.png"
             class="hover-image"
             data-hover="badoutfittopyes.png"
             alt="Image 1">
    </a>

    <a href="page17.html">
        <img src="perfecttopno.png"
             class="hover-image"
             data-hover="perfecttopyes.png"
             alt="Image 2">
    </a>

    <a href="page13.html">
        <img src="goodendingtopno.png"
             class="hover-image"
             data-hover="goodendingtopyes.png"
             alt="Image 3">
    </a>
</div>

 <img src="pajama.png"
     class="pajama-image"
     alt="Pajamas">


     <div style="
    position: absolute;
    bottom: 30px;
    left: 80px;
    width: 850px;
    background-color: white;
    padding: 15px 25px;
    box-sizing: border-box;
    border-radius: 5px;
">
    <h1 style="
        color: deeppink;
        margin: 0;
    ">
       ♥︎  "ugh! give me a top!!!"
    </h1>
</div>
    <script>
    document.querySelectorAll(".hover-image").forEach(img => {
        const originalImage = img.src;
        const hoverImage = img.dataset.hover;

        img.addEventListener("mouseenter", () => {
            img.src = hoverImage;
        });

        img.addEventListener("mouseleave", () => {
            img.src = originalImage;
        });
    });
</script>
</body>
</html>
